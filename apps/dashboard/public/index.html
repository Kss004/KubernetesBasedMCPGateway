<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urumi Gateway Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Urumi Gateway</h1>
  <nav id="nav" hidden>
    <button data-sec="servers">Servers</button>
    <button data-sec="team">Team &amp; Keys</button>
    <button data-sec="audit">Audit</button>
    <button data-sec="chat">Chat</button>
  </nav>
  <div id="who" hidden><span id="whoami"></span> <button id="logout">Logout</button></div>
</header>
<main>
  <p id="status" role="status"></p>

  <section id="sec-login">
    <h2>Login</h2>
    <form id="login-form">
      <label>Name <input id="login-name" autocomplete="username" required></label>
      <label>Password <input id="login-pass" type="password" autocomplete="current-password" required></label>
      <button type="submit">Login</button>
    </form>
  </section>

  <section id="sec-servers" hidden>
    <h2>Servers <button id="servers-reload">Reload</button></h2>
    <table id="servers-table">
      <thead><tr><th>Slug</th><th>URL</th><th>Status</th><th>Enabled</th><th>Tools</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
    <h3>Add server</h3>
    <form id="server-add">
      <label>Slug <input id="add-slug" placeholder="woo" required pattern="[a-z0-9-]{1,32}"></label>
      <label>URL <input id="add-url" placeholder="http://woo-mcp.urumi-store:3000/mcp" required size="44"></label>
      <label>Auth <select id="add-auth"><option value="none">none</option><option value="bearer">bearer</option><option value="header">header</option></select></label>
      <label>Header <input id="add-header" placeholder="only for header auth"></label>
      <label>Secret <input id="add-secret" type="password" placeholder="required unless none"></label>
      <button type="submit">Add</button>
    </form>
  </section>

  <section id="sec-team" hidden>
    <h2>Team &amp; Keys <button id="team-reload">Reload</button></h2>
    <div id="admin-team" hidden>
      <h3>Users</h3>
      <table id="users-table">
        <thead><tr><th>Name</th><th>Role</th><th>Set password (invite)</th></tr></thead>
        <tbody></tbody>
      </table>
      <form id="user-add">
        <label>Name <input id="user-name" required maxlength="64"></label>
        <label>Role <select id="user-role"><option value="member">member</option><option value="admin">admin</option></select></label>
        <button type="submit">Create user</button>
      </form>
      <h3>All keys (admin)</h3>
      <table id="keys-table">
        <thead><tr><th>User</th><th>Prefix</th><th>Revoked</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
      <form id="key-add">
        <label>User <select id="key-user"></select></label>
        <button type="submit">Create key</button>
      </form>
    </div>
    <h3>My keys</h3>
    <table id="mykeys-table">
      <thead><tr><th>Prefix</th><th>Revoked</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="mykey-create">Create my key</button>
    <p id="newkey" hidden></p>
  </section>

  <section id="sec-audit" hidden>
    <h2>Audit (latest 200) <button id="audit-reload">Reload</button></h2>
    <table id="audit-table">
      <thead><tr><th>Time</th><th>User</th><th>Server</th><th>Tool</th><th>Outcome</th><th>Error</th><th>ms</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="sec-chat" hidden>
    <h2>Chat</h2>
    <div id="chat-log"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="3" placeholder="Ask about orders, products…" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
