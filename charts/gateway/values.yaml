appHost: app.localhost

ingress:
  className: nginx
  # Namespace (and optional pod labels) of the ingress controller; NetworkPolicies
  # admit only it to the web pods.
  controllerNamespace: ingress-nginx
  controllerPodLabels: {}
  # Name of a kubernetes.io/tls Secret in this namespace; empty = no tls block.
  tlsSecretName: ""
  # true when cert-manager issues tlsSecretName via ACME HTTP-01 in this namespace:
  # admits the controller to the solver pods (port 8089) past default-deny.
  acmeHttp01: false
  # Traefik only, and only with tlsSecretName: redirect http to https (Middleware CRD).
  httpsRedirect: false
  # Controller-specific; these keep /mcp and chat SSE streaming on ingress-nginx (T1.2).
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

# e.g. [{ name: ghcr-pull }]; created out-of-band with kubectl, never in values.
imagePullSecrets: []

images:
  postgres: "postgres:17"
  gateway: "gateway"
gatewayTag: "0.4.15"

storage:
  postgres: 5Gi
  className: "" # empty = cluster default StorageClass

# Timezone for chat's "today" (prompt date and list_orders after/before). Must equal the
# store chart's `timezone`, since WooCommerce reads after/before in site-local time.
storeTimezone: "UTC"

session:
  # Bug 6: adds Secure to the session cookie. Keep false over plain http (kind, k3d):
  # browsers drop Secure cookies on http and login would silently fail.
  cookieSecure: false

llm:
  # D10 (revised 2026-10-20): OpenCode Go DeepSeek primary; Groq's free tier refused about
  # half the demo prompts. OpenCode Go targets coding agents and monitors traffic; the
  # gateway identifies itself honestly (User-Agent + x-opencode-session). Any
  # OpenAI-compatible endpoint works; switching the primary is these three values:
  #   Groq:            baseUrl https://api.groq.com/openai/v1, model qwen/qwen3.8-27b, secretName llm-groq
  #   Gemini:          baseUrl https://generativelanguage.googleapis.com/v1beta/openai,
  #                    model gemini-3.8-flash, secretName llm
  #   Ollama:          baseUrl http://<host>:11434/v1 with a local model name
  # The key is never a value: `make secrets` creates the out-of-band Secret.
  baseUrl: "https://opencode.ai/zen/go/v1"
  model: "deepseek-v4.1-flash" # listed by GET /v1/models for this key on 2026-10-20
  # Secret (key: api-key) holding the provider key; one Secret per provider:
  # llm-opencode (OpenCode Go), llm-groq (Groq), llm (Gemini).
  secretName: "llm-opencode"
  # Automatic fallback: used when the primary fails (timeout, 4xx/5xx, rate limit after one
  # retry); that request stays on it and the primary rests 60s. Empty baseUrl turns it off.
  fallback:
    baseUrl: "https://api.groq.com/openai/v1"
    model: "qwen/qwen3.8-27b"
    secretName: "llm-groq"
