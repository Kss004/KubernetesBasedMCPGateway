{{- if gt (int .Values.replicas) 1 }}
# With 2+ replicas, a node drain or rolling update always leaves one gateway serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
{{- end }}
