# Generated secrets carry keep (D20). Losing CRED_KEY makes stored upstream
# credentials unreadable — documented, no recovery path by design.
{{- $pg := lookup "v1" "Secret" .Release.Namespace (printf "%s-pg" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pg
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ if $pg }}{{ index $pg.data "password" | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
---
{{- $ck := lookup "v1" "Secret" .Release.Namespace (printf "%s-cred" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cred
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ if $ck }}{{ index $ck.data "key" | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
---
# Bootstrap admin token for /api/* (T3.2). P4 login replaces it; make seed
# reads it with kubectl (gateway never crosses namespaces for other secrets).
{{- $at := lookup "v1" "Secret" .Release.Namespace (printf "%s-admin" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ if $at }}{{ index $at.data "token" | b64dec }}{{ else }}{{ randAlphaNum 48 }}{{ end }}
