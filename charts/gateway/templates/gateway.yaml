apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  ports:
    - port: 3000
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  # Any replica serves any request (D6); limits and login locks are counted in Postgres.
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway }}:{{ .Values.gatewayTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PGHOST
              value: {{ .Release.Name }}-postgres
            - name: PGUSER
              value: gateway
            - name: PGDATABASE
              value: gateway
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-pg, key: password }
            - name: CRED_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-cred, key: key }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-admin, key: token }
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-session, key: secret }
            - name: STORE_TIMEZONE
              value: {{ .Values.storeTimezone | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.session.cookieSecure | quote }}
            - name: RATE_MCP_PER_MINUTE
              value: {{ .Values.rateLimit.mcpPerMinute | quote }}
            - name: RATE_CHAT_PER_MINUTE
              value: {{ .Values.rateLimit.chatPerMinute | quote }}
            # Multi-store: the dashboard's Stores tab is live only with the provisioner deployed.
            - name: CHAT_TOOL_SEARCH_THRESHOLD
              value: {{ .Values.chat.toolSearchThreshold | quote }}
            - name: STORES_ENABLED
              value: {{ .Values.provisioner.enabled | quote }}
            - name: STORES_PER_USER
              value: {{ .Values.provisioner.maxPerUser | quote }}
            - name: STORES_MAX
              value: {{ .Values.provisioner.maxTotal | quote }}
            - name: STORES_TIMEOUT_MIN
              value: {{ .Values.provisioner.timeoutMin | quote }}
            - name: HOSTED_MAX
              value: {{ .Values.provisioner.hosted.max | quote }}
            - name: HOSTED_IMAGE_PREFIXES
              value: {{ join "," .Values.provisioner.hosted.imagePrefixes | quote }}
            # P6 chat LLM (D10): base URL + pinned model are values (not secrets);
            # the key arrives out-of-band via `make secrets` (optional so the
            # gateway still boots without it; /api/chat then answers 503).
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.llm.secretName | quote }}, key: api-key, optional: true }
            {{- with .Values.llm.fallback }}
            {{- if .baseUrl }}
            # Automatic fallback when the primary fails (D10); empty baseUrl turns it off.
            - name: LLM_FALLBACK_BASE_URL
              value: {{ .baseUrl | quote }}
            - name: LLM_FALLBACK_MODEL
              value: {{ .model | quote }}
            - name: LLM_FALLBACK_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .secretName | quote }}, key: api-key, optional: true }
            {{- end }}
            {{- end }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # The server listens only after migrations, which wait for Postgres (first
          # install: image pull). Hold liveness off until then: up to 40 x 5s = 200s.
          startupProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
---
# app.localhost routes (T1.2: buffering off + long timeouts for /mcp + chat SSE).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway
  {{- $ann := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if and .Values.ingress.httpsRedirect .Values.ingress.tlsSecretName }}
  {{- $_ := set $ann "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-https-redirect@kubernetescrd" .Release.Namespace .Release.Name) }}
  {{- end }}
  {{- with $ann }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.appHost | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "appHost is required" .Values.appHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port: { number: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
          {{- with .Values.ingress.controllerPodLabels }}
          podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
          {{- end }}
      ports: [{ port: 3000 }]
    {{- if .Values.provisioner.enabled }}
    # The provisioner registers each new store's MCP server through the admin API.
    - from:
        - podSelector:
            matchLabels: { app: provisioner }
      ports: [{ port: 3000 }]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
        {{- if .Values.provisioner.enabled }}
        - podSelector:
            matchLabels: { app: provisioner } # reads and updates the stores table
        {{- end }}
      ports: [{ port: 5432 }]
