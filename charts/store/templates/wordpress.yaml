apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-wordpress-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.wordpress }}
  {{- with .Values.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: wordpress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      # No runAsNonRoot: the official wordpress image serves on :80 as root.
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          ports:
            - containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ .Release.Name }}-mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-db, key: password }
            # Site URL via config, not the database (D21): survives domain changes.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ include "store.url" . }}');
                define('WP_SITEURL', '{{ include "store.url" . }}');
          volumeMounts:
            - name: docroot
              mountPath: /var/www/html
          resources: {{ .Values.resources.wordpress | toJson | nindent 12 }}
          # Not "/" or wp-login.php: WordPress redirects those to the canonical URL or,
          # with an https storeUrl, to https (FORCE_SSL_ADMIN), which the probe then
          # follows to the pod and fails. A REST request ends in parse_request, before
          # any redirect, works without pretty permalinks, and still loads PHP + DB.
          readinessProbe:
            httpGet: { path: "/?rest_route=/", port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 10
          # Liveness only asks "is Apache up": a DB outage should mark the pod
          # not-ready, not restart it.
          livenessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: docroot
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-wordpress
  {{- $ann := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if and .Values.ingress.httpsRedirect .Values.ingress.tlsSecretName }}
  {{- $_ := set $ann "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-https-redirect@kubernetescrd" .Release.Namespace .Release.Name) }}
  {{- end }}
  {{- with $ann }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $.Values.storeHost | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "storeHost is required" .Values.storeHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-wordpress
                port: { number: 80 }
