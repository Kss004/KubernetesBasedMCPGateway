{{- if and .Values.ingress.httpsRedirect .Values.ingress.tlsSecretName }}
# Traefik only: plain http on this host gets a permanent redirect to https, so the
# Secure session cookie is never dropped on an http page. cert-manager's HTTP-01
# solver Ingress is a separate, more specific router without this middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
