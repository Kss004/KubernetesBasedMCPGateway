# All generated secrets carry helm.sh/resource-policy: keep (D20) so
# helm uninstall keeps PVCs AND the passwords that unlock them.
# randAlphaNum + lookup: upgrades reuse the existing value.
{{- $db := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  root-password: {{ if $db }}{{ index $db.data "root-password" | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
  password: {{ if $db }}{{ index $db.data "password" | b64dec }}{{ else }}{{ randAlphaNum 32 }}{{ end }}
---
{{- $wp := lookup "v1" "Secret" .Release.Namespace (printf "%s-wp-admin" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-wp-admin
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ if $wp }}{{ index $wp.data "password" | b64dec }}{{ else }}{{ randAlphaNum 24 }}{{ end }}
---
# Inbound bearer token the gateway presents to woo-mcp (D18). Different value
# from the WooCommerce REST key/secret (those live in a Secret written by the
# T1.4 bootstrap Job; this one only gates gateway -> woo-mcp).
{{- $in := lookup "v1" "Secret" .Release.Namespace (printf "%s-woo-inbound" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-woo-inbound
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ if $in }}{{ index $in.data "token" | b64dec }}{{ else }}{{ randAlphaNum 48 }}{{ end }}
