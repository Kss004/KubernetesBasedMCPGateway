# Ingress default-deny everywhere (D25: no egress deny — chat agent needs LLM egress).
# Selectors for woo-mcp (T2.4) and the bootstrap Job (T1.4) are included now;
# they match nothing until those pods exist, which is harmless.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-ingress
spec:
  podSelector:
    matchLabels: { app: wordpress }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports: [{ port: 80 }]
    - from:
        - podSelector:
            matchLabels: { app: woo-mcp }
      ports: [{ port: 80 }]
    - from:
        - podSelector:
            matchLabels: { app: store-bootstrap }
      ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-ingress
spec:
  podSelector:
    matchLabels: { app: mariadb }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: wordpress }
      ports: [{ port: 3306 }]
    - from:
        - podSelector:
            matchLabels: { app: store-bootstrap }
      ports: [{ port: 3306 }]
