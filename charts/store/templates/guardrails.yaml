{{- if .Values.guardrails.enabled }}
# Provisioned stores (multi-store bonus): a hard ceiling per store namespace, so one store
# cannot starve the node or the other stores. LimitRange gives defaults to any container that
# declares none and caps any single container.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: store-quota
spec:
  hard: {{- toYaml .Values.guardrails.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: store-limits
spec:
  limits:
    - type: Container
      default: {{- toYaml .Values.guardrails.containerDefault.limits | nindent 8 }}
      defaultRequest: {{- toYaml .Values.guardrails.containerDefault.requests | nindent 8 }}
      max: {{- toYaml .Values.guardrails.containerMax | nindent 8 }}
{{- end }}
