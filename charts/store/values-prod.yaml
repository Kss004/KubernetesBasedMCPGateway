# Prod overrides for k3s (k3d rehearsal on the PC; Mac mini or VPS later).

# Required: Ingress host, e.g. --set storeHost=shop.example.com
storeHost: ""
# Public URL WordPress uses for links and redirects (D21). Set it when the URL
# is https or has a port, e.g. https://shop.example.com. Empty = http://<storeHost>.
storeUrl: ""

ingress:
  className: traefik # k3s bundled Traefik
  controllerNamespace: kube-system # k3s runs Traefik here
  controllerPodLabels: { app.kubernetes.io/name: traefik } # only Traefik, not all of kube-system
  tlsSecretName: "" # see the gateway chart; not exercised on k3d
  acmeHttp01: true # see the gateway chart
  httpsRedirect: true # see the gateway chart
  annotations: {}

images:
  wordpress: "wordpress:7.1.3-apache" # official images, multi-arch
  mariadb: "mariadb:11.8"
  wpCli: "wordpress:cli-2.12.0"

storage:
  mariadb: 5Gi
  wordpress: 5Gi
  className: local-path # k3s local-path-provisioner

wooMcp:
  image: ghcr.io/kss004/kubernetesbasedmcpgateway/woo-mcp # buildx multi-arch, not pushed yet

imagePullSecrets: [] # [{ name: ghcr-pull }] for private GHCR packages
